<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麺処けんた お品書き</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: スマホで縦に読む「お品書き」。紺ののれんの見出し → 看板メニューを大きな写真で → 2列の写真グリッド → トッピングは値札の一覧 */
:root{
  --noren:#1C2640; --noren-2:#26324F; --red:#B8322A; --gold:#C99A4B;
  --paper:#F5EDE1; --paper-2:#EBDFCD; --ink:#2A1C14; --ink-dim:#76604F; --rule:#D8C7AF;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.7}
.in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.noren{background:var(--noren);color:var(--paper);position:relative;overflow:hidden}
.noren::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 2px),rgba(0,0,0,.22) calc(25% - 2px) 25%);pointer-events:none}
.noren .in{position:relative;z-index:1;padding-block:28px 26px;display:grid;gap:4px}
.kicker{font-size:12px;letter-spacing:.3em;color:var(--gold)}
.shop{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.15;margin:0;letter-spacing:.06em}
.sub{margin:4px 0 0;font-size:14px;opacity:.85}
.redline{height:8px;background:var(--red)}

.ph{position:relative;border-radius:14px;overflow:hidden;background:var(--paper-2);aspect-ratio:4/3;max-width:100%}
.ph img,.ph svg{display:block;width:100%;height:100%;object-fit:cover}
.ph .tbd{position:absolute;right:8px;bottom:8px;background:rgba(28,38,64,.78);color:#F5EDE1;font-size:10.5px;padding:2px 8px;border-radius:10px}

.hero{padding-block:24px 8px;display:grid;gap:14px}
.hero .ph{aspect-ratio:2/1;border-radius:18px}
.badge{position:absolute;left:12px;top:12px;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:4px 12px;border-radius:20px;letter-spacing:.06em}
.hero h2{font-family:var(--display);font-weight:900;font-size:28px;line-height:1.3;margin:0}
.price{font-family:var(--display);font-weight:900;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font-size:.55em;font-weight:700;margin-left:2px;color:var(--ink-dim)}
.hero .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hero .price{font-size:30px}
.desc{margin:0;color:var(--ink-dim);font-size:14.5px}

section{padding-block:26px 4px}
.sec{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec h3{font-family:var(--display);font-weight:900;font-size:24px;margin:0}
.sec span{font-size:12px;color:var(--ink-dim)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:640px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{display:flex;flex-direction:column;gap:6px;min-width:0}
.item h4{margin:0;font-size:15.5px;font-weight:700;line-height:1.4;text-wrap:balance}
.item .price{font-size:19px}
.item p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.55}
.tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:2px}

.list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:15px}
.list li .dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px)}
.list .price{font-size:17px}

.info{margin-top:30px;background:var(--noren);color:var(--paper)}
.info .in{padding-block:24px 30px;display:grid;gap:14px}
.info h3{font-family:var(--display);font-size:22px;margin:0}
.info dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:14.5px}
.info dt{color:var(--gold);font-weight:700}
.info dd{margin:0}
.back{background:var(--red);color:#fff;border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.6}
.back b{font-family:var(--display);font-size:17px;display:block}
.fine{font-size:11.5px;opacity:.7;margin:0}
</style>
</head>
<body>

<header class="noren"><div class="in">
  <div class="kicker">OSHINAGAKI</div>
  <h1 class="shop">麺処 けんた</h1>
  <p class="sub">自家製麺と毎日炊くスープの一杯</p>
</div></header>
<div class="redline"></div>

<main class="in" id="app"></main>

<footer class="info"><div class="in">
  <h3>お店の情報</h3>
  <dl>
    <dt>営業時間</dt><dd>11:00〜22:00（L.O. 21:30）</dd>
    <dt>定休日</dt><dd>水曜日</dd>
    <dt>場所</dt><dd>岡山駅東口から徒歩すぐ<br>岡山市北区駅元町1-1</dd>
    <dt>お支払い</dt><dd>現金・各種QR決済</dd>
  </dl>
  <div class="back"><b>順番待ちはLINEから</b>このページを閉じてトークに戻り、下のメニューの「順番待ち受付」を押してください。待っている間にメニューを決めておくと、ご案内後すぐにご注文いただけます。</div>
  <p class="fine">※デモ用のページです。写真はイメージで、価格・営業情報はすべて例です。</p>
</div></footer>

      { name:'つけ麺', price:950, img:IMG.tsuke, tag:'並・中盛同料金', desc:'太麺を濃いめの魚介豚骨つけ汁で。〆はスープ割りで。', art:{broth:'tsuke', egg:1, chashu:1, nori:true} },
      { name:'辛味噌らーめん', price:1000, img:IMG.miso, tag:'ピリ辛', desc:'自家製の辛味噌をとかして、寒い日にうれしい一杯。', art:{broth:'miso', chashu:1, negi:true, menma:true} },
      { name:'まかない油そば', price:900, img:IMG.abura, desc:'スープなしの汁なし麺。よく混ぜてどうぞ。', art:{broth:'abura', egg:1, chashu:1, negi:true, nori:true} }
    ]},
    { title:'ご飯もの・一品', cols:2, items:[
      { name:'炙りチャーシュー丼', price:400, img:IMG.don, desc:'香ばしく炙ったチャーシューを甘辛だれで。', art:{dish:'don'} },
      { name:'焼き餃子（5個）', price:350, img:IMG.gyoza, desc:'パリッと焼き上げた、野菜たっぷりの餃子。', art:{dish:'gyoza'} }
    ]}
  ],
  toppings: [['味玉',120],['チャーシュー（3枚）',300],['メンマ',100],['海苔（5枚）',100],['ネギ増し',100],['ライス',150]]
};

// ===== 仮の写真（上から見たどんぶりのイラスト） =====
const BROTH={shoyu:['#C9813B','#8A4A1C'],shio:['#F0D9A6','#D6B06B'],miso:['#E0A24A','#B5651D'],tsuke:['#7A3E1A','#4A220C'],abura:['#E9C77A','#C99A4B']};
function art(a,id){
  if(a.dish==='don') return donSVG(id);
  if(a.dish==='gyoza') return gyozaSVG(id);
  const [c1,c2]=BROTH[a.broth]||BROTH.shoyu; let s='';
  s+='<rect width="400" height="300" fill="#2A1C14"/><rect width="400" height="300" fill="url(#wood'+id+')"/>';
  s+='<ellipse cx="200" cy="158" rx="150" ry="132" fill="#00000055"/><circle cx="200" cy="150" r="138" fill="#1C2640"/><circle cx="200" cy="150" r="138" fill="none" stroke="#B8322A" stroke-width="10" stroke-dasharray="18 10"/>';
  s+='<circle cx="200" cy="150" r="118" fill="url(#br'+id+')"/>';
  // 麺
  for(let i=0;i<9;i++){const y=95+i*12;s+='<path d="M120 '+y+' q40 -10 80 0 t80 0" stroke="#F3D58A" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>';}
  if(a.chashu){for(let i=0;i<a.chashu;i++){const x=150+i*24,y=95+i*8;s+='<ellipse cx="'+x+'" cy="'+y+'" rx="34" ry="26" fill="#C98B66" stroke="#7A4026" stroke-width="5"/><ellipse cx="'+x+'" cy="'+y+'" rx="18" ry="12" fill="#E8B79A"/>';}}
  if(a.nori) s+='<rect x="268" y="62" width="44" height="70" rx="4" fill="#1F2B1F" transform="rotate(18 290 97)"/>';
  if(a.menma){for(let i=0;i<4;i++)s+='<rect x="'+(120+i*12)+'" y="'+(170+i*4)+'" width="10" height="34" rx="4" fill="#D9A64E" transform="rotate(-25 130 190)"/>';}
  if(a.egg){for(let i=0;i<a.egg;i++){const x=232+i*40,y=190-i*10;s+='<ellipse cx="'+x+'" cy="'+y+'" rx="26" ry="32" fill="#F6E7CF" stroke="#C88A45" stroke-width="4"/><circle cx="'+x+'" cy="'+(y+2)+'" r="15" fill="#F08A12"/><circle cx="'+(x-4)+'" cy="'+(y-3)+'" r="5" fill="#FFC56A"/>';}}
  if(a.negi){for(let i=0;i<22;i++){const x=150+((i*37)%110),y=200+((i*23)%40);s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#6FBF4A" stroke="#3E7F26" stroke-width="2"/>';}}
  if(a.broth==='miso') for(let i=0;i<14;i++)s+='<circle cx="'+(150+(i*29)%100)+'" cy="'+(120+(i*41)%90)+'" r="3" fill="#B8322A" opacity=".8"/>';
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="料理のイメージイラスト"><defs><radialGradient id="br'+id+'" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></radialGradient><linearGradient id="wood'+id+'" x1="0" x2="1"><stop offset="0" stop-color="#5A3A24"/><stop offset=".5" stop-color="#6E4A2E"/><stop offset="1" stop-color="#4A2E1C"/></linearGradient></defs>'+s+'</svg>';
}
function donSVG(id){
  let s='<rect width="400" height="300" fill="#5A3A24"/><circle cx="200" cy="150" r="130" fill="#1C2640"/><circle cx="200" cy="150" r="110" fill="#FBF6EC"/>';
  for(let i=0;i<5;i++){const a=i*72*Math.PI/180;s+='<ellipse cx="'+(200+Math.cos(a)*45)+'" cy="'+(150+Math.sin(a)*45)+'" rx="40" ry="28" fill="#B9764E" stroke="#6E3A20" stroke-width="5" transform="rotate('+(i*72)+' '+(200+Math.cos(a)*45)+' '+(150+Math.sin(a)*45)+')"/>';}
  s+='<circle cx="200" cy="150" r="20" fill="#F08A12"/>';
  for(let i=0;i<14;i++)s+='<circle cx="'+(150+(i*37)%100)+'" cy="'+(110+(i*29)%80)+'" r="4" fill="#6FBF4A"/>';
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="料理のイメージイラスト">'+s+'</svg>';
}
function gyozaSVG(id){
  let s='<rect width="400" height="300" fill="#4A2E1C"/><ellipse cx="200" cy="150" rx="170" ry="110" fill="#F4EEE4" stroke="#1C2640" stroke-width="10"/>';
  for(let i=0;i<5;i++){const x=95+i*52;s+='<path d="M'+x+' 190 q26 -110 52 0 z" fill="#E8C68A" stroke="#B07A3A" stroke-width="4"/><path d="M'+x+' 190 q26 -30 52 0" fill="#B5662A"/>';}
  s+='<circle cx="330" cy="105" r="22" fill="#3A1E10"/>';
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="料理のイメージイラスト">'+s+'</svg>';
}
function photo(it,id,cls){
  const inner=it.img?'<img src="'+it.img+'" alt="'+it.name+'" loading="lazy">':art(it.art||{},id)+'<span class="tbd">写真は差し替え予定</span>';
  return '<div class="ph'+(cls||'')+'">'+inner+(it.badge?'<span class="badge">'+it.badge+'</span>':'')+'</div>';
}
const yen=n=>n.toLocaleString('ja-JP')+'<small>円</small>';

let h='', n=0;
const H=MENU.hero;
h+='<div class="hero">'+photo(H,n++)+'<div class="row"><h2>'+H.name+'</h2><span class="price">'+yen(H.price)+'</span></div><p class="desc">'+H.desc+'</p></div>';
MENU.sections.forEach(sec=>{
  h+='<section><div class="sec"><h3>'+sec.title+'</h3>'+(sec.note?'<span>'+sec.note+'</span>':'')+'</div><div class="grid'+(sec.cols===3?' three':'')+'">';
  sec.items.forEach(it=>{h+='<div class="item">'+photo(it,n++)+(it.tag?'<div><span class="tag">'+it.tag+'</span></div>':'')+'<h4>'+it.name+'</h4><span class="price">'+yen(it.price)+'</span><p>'+it.desc+'</p></div>';});
  h+='</div></section>';
});
h+='<section><div class="sec"><h3>トッピング</h3><span>どのらーめんにも追加できます</span></div><ul class="list">'+
   MENU.toppings.map(t=>'<li><span>'+t[0]+'</span><span class="dots"></span><span class="price">'+yen(t[1])+'</span></li>').join('')+'</ul></section>';
document.getElementById('app').innerHTML=h;
</script>
